name: Continuous Deployment (CD)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Conditional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/telco-churn:latest', secrets.DOCKERHUB_USERNAME) || 'telco-churn:latest' }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/telco-churn:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('telco-churn:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
