xgboost:
  n_estimators: 301
  learning_rate: 0.034
  max_depth: 7
  subsample: 0.95
  colsample_bytree: 0.98
  min_child_weight: 1
  reg_alpha: 0.0
  reg_lambda: 1.0

random_forest:
  n_estimators: 200
  max_depth: 8
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42

logistic_regression:
  max_iter: 1000
  class_weight: balanced
  random_state: 42

optuna:
  n_trials: 30
  optimization_metric: pr_auc
  direction: maximize

split:
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  stratify: true
